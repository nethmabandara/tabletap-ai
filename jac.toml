[project]
name = "tabletap-ai"
version = "0.1.0"
description = "A full-stack Jac application"
entry-point = "main"
kind = "web-app"
jac-version = "==0.37.25"

[dependencies]
[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
qrcode-generator = "^2.0.4"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"



[dev-dependencies]
[dev-dependencies.pypi]
watchdog = ">=3.0.0"


[client]

[byllm.model]
default_model = "claude-haiku-5-5"

[placement.pins]
"core.models" = "server"
"core.seed" = "server"
"core.menu" = "server"
"core.orders" = "server"
"core.kitchen" = "server"
"core.waiter_rules" = "server"
"core.waiter_safety" = "server"
"core.agents" = "server"
"core.waiter" = "server"
"core.menu_rules" = "server"
"core.menu_agent" = "server"
"core.menu_draft" = "server"
"core.menu_edit" = "server"
"core.menu_setup" = "server"
"core.menu_publish" = "server"
"core.restaurants" = "server"
"core.dj_agent" = "server"
"core.dj" = "server"
"core.music" = "server"
